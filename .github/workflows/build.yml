name: build test

on:
  workflow_call:
    inputs:
      buildSystem:
        default: ubuntu-latest
        type: string
      workingBranch:
        default: Testing_workflows
        type: string
      workingRepo:
        default: StateOS_BA
        type: string
      workingOrg:
        default: MertensFlo
        type: string
      callerBranch:
        default: Testing_workflows
        type: string
      callerRepo:
        default: StateOS_BA
        type: string
      callerOrg:
        default: MertensFlo
        type: string
      arm_version:
        default: 11.3.rel1
        type: string
      cmake_version:
        default: cmake
        type: string
      flag_arm:
        default: false
        type: boolean
      flag_submodule:
        default: false
        type: boolean
      flag_ninja:
        default: false
        type: boolean

  
jobs:
  build:
    name: build test
    runs-on: ${{ (inputs.buildSystem)}}
    steps:
    - name: Checkout actions repo for wanted branch
      uses: actions/checkout@v4
      with: 
        repository: ${{inputs.workingOrg}}/${{inputs.workingRepo}}
        ref: ${{ inputs.workingBranch }}
        sparse-checkout: |
          .github/workflows
        sparse-checkout-cone-mode: false
        
    - name: checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{inputs.callerOrg}}/${{inputs.callerRepo}}
        ref: ${{ inputs.callerBranch }}
        submodules: ${{inputs.flag_submodule}}

    - name: checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{inputs.callerOrg}}/${{inputs.callerRepo}}
        ref: ${{ inputs.callerBranch }}
        submodules: ${{inputs.flag_submodule}}

    - name: Checkout actions repo for wanted branch
      uses: actions/checkout@v4
      with: 
        repository: ${{inputs.workingOrg}}/${{inputs.workingRepo}}
        ref: ${{ inputs.workingBranch }}
        sparse-checkout: |
          .github
        sparse-checkout-cone-mode: false

    - name: install dependencies
      uses: ./.github/actions/universal/action_install_dependencies
      with: 
        flag_ninja: ${{inputs.flag_ninja}}
        cmake_version: ${{inputs.cmake_version}}

    - name: build specific
      if: ${{inputs.workingRepo}} == StateOS_BA
      uses: ./.github/actions/universal/action_build_specific_commands
      with:
        arm_version: ${{ inputs.arm_version}}
        flag_arm: ${{inputs.flag_arm}}

    - name: check installs
      uses: ./.github/actions/universal/action_check_installs
      with:
        flag_arm: ${{inputs.flag_arm}}

    - name: make build
      uses: ./.github/actions/build/action_make_build
      with:
        flag_ninja: ${{inputs.flag_ninja}}

    
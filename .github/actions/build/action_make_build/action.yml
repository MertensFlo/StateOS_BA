inputs:
  flag_ninja:
    default: false
    type: boolean

runs:
  using: composite
  steps:
  - if: ${{inputs.flag_ninja}}
    name: cmake ninja
    shell: bash
    run: cmake -S. -Bbuild -GNinja
  - name: make build
    shell: bash
    run: cmake --build build -v
  - name: test
    shell: bash
    run: echo hallihallo
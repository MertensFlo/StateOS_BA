inputs:
  arm_path:
    type: string
  arm_tar_path:
    type: string
  arm_dir_path:
    type: string
  flag_arm:
    default: false
    type: boolean
  

runs:
  using: composite
  steps: 
  - if: ${{inputs.flag_arm}}
    name: execute script
    working-directory: ./scripts
    shell: bash
    run: bash ./install_pipeline_specific.sh ${{inputs.arm_path}} ${{inputs.arm_tar_path}} ${{inputs.arm_dir_path}}

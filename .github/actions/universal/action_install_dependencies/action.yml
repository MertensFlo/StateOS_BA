inputs:
  flag_ninja:
    default: false
    type: boolean
    
runs:
  using: composite
  steps:
  - name: apt-get update
    shell: bash
    run: |
      sudo apt-get -y -qq update
  - if: ${{inputs.flag_ninja}}
    name: install cmake
    shell: bash
    run: sudo apt-get -y -qq install cmake ninja-build
    
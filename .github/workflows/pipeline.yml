name: CI

on:
  workflow_call:
    inputs:
      buildSystem:
        default: ubuntu-latest
        type: string
      workingBranch:
        default: Testing_workflows
        type: string
      workingRepo:
        default: StateOS_BA
        type: string
      workingOrg:
        default: MertensFlo
        type: string
      callerBranch:
        default: Testing_workflows
        type: string
      callerRepo:
        default: StateOS_BA
        type: string
      callerOrg:
        default: MertensFlo
        type: string
      arm_path:
        default: https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi.tar.xz
        type: string
      arm_tar_path:
        default: arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi.tar.xz
        type: string
      arm_dir_path:
        default: ${{github.workspace}}/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi/bin
        type: string
      arm_condition:
        type: string
      cmake_version:
        default: cmake
        type: string
      flag_arm:
        default: false
        type: boolean
      flag_submodule:
        default: false
        type: boolean
      flag_ninja:
        default: false
        type: boolean
      flag_cmake_build:
        default: false
        type: boolean
      example_test:
        default: false
        type: boolean
      static_test:
        default: false
        type: boolean
      unit_test:
        default: false
        type: boolean
  
jobs:
  call-build:
    uses: ./.github/workflows/build.yml
    with:
      buildSystem: ${{inputs.buildSystem}}
      workingBranch: ${{inputs.workingBranch}}
      workingRepo: ${{inputs.workingRepo}}
      workingOrg: ${{inputs.workingOrg}}
      callerBranch: ${{inputs.callerBranch}}
      callerRepo: ${{inputs.callerRepo}}
      callerOrg: ${{inputs.callerOrg}}
      arm_path: ${{inputs.arm_path}}
      arm_tar_path: ${{inputs.arm_tar_path}}
      arm_dir_path: ${{inputs.arm_dir_path}}
      arm_condtion: ${{inputs.arm_condition}}
      cmake_version: ${{inputs.cmake_version}}
      flag_arm: ${{inputs.flag_arm}}
      flag_submodule: ${{inputs.flag_submodule}}
      flag_ninja: ${{inputs.flag_ninja}}
      flag_cmake_build: ${{inputs.flag_cmake_build}}

  call-example:
    needs: call-build
    if: ${{inputs.example_test}}
    uses: ./.github/workflows/test.yml
    with:
      buildSystem: ${{inputs.buildSystem}}
      workingBranch: ${{inputs.workingBranch}}
      workingRepo: ${{inputs.workingRepo}}
      workingOrg: ${{inputs.workingOrg}}
      callerRepo: ${{inputs.callerRepo}}
      callerOrg: ${{inputs.callerOrg}}
      arm_path: ${{inputs.arm_path}}
      arm_tar_path: ${{inputs.arm_tar_path}}
      arm_dir_path: ${{inputs.arm_dir_path}}
      arm_condtion: ${{inputs.arm_condition}}
      flag_arm: ${{inputs.flag_arm}}
      flag_submodule: ${{inputs.flag_submodule}}
      flag_ninja: ${{inputs.flag_ninja}}
      current_test_element: example

  call-static-code-test:
    needs: call-build
    if: ${{inputs.static_test}}
    uses: ./.github/workflows/test.yml
    with:
      buildSystem: ${{inputs.buildSystem}}
      workingBranch: ${{inputs.workingBranch}}
      workingRepo: ${{inputs.workingRepo}}
      workingOrg: ${{inputs.workingOrg}}
      callerRepo: ${{inputs.callerRepo}}
      callerOrg: ${{inputs.callerOrg}}
      arm_path: ${{inputs.arm_path}}
      arm_tar_path: ${{inputs.arm_tar_path}}
      arm_dir_path: ${{inputs.arm_dir_path}}
      arm_condtion: ${{inputs.arm_condition}}
      flag_arm: ${{inputs.flag_arm}}
      flag_submodule: ${{inputs.flag_submodule}}
      flag_ninja: ${{inputs.flag_ninja}}
      current_test_element: static

  call-unit-test:
    needs: call-build
    if: ${{inputs.unit_test}}
    uses: ./.github/workflows/test.yml
    with:
      buildSystem: ${{inputs.buildSystem}}
      workingBranch: ${{inputs.workingBranch}}
      workingRepo: ${{inputs.workingRepo}}
      workingOrg: ${{inputs.workingOrg}}
      callerRepo: ${{inputs.callerRepo}}
      callerOrg: ${{inputs.callerOrg}}
      arm_path: ${{inputs.arm_path}}
      arm_tar_path: ${{inputs.arm_tar_path}}
      arm_dir_path: ${{inputs.arm_dir_path}}
      flag_arm: ${{inputs.flag_arm}}
      flag_submodule: ${{inputs.flag_submodule}}
      flag_ninja: ${{inputs.flag_ninja}}
      current_test_element: unit
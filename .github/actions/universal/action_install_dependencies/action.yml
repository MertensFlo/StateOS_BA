inputs:
  flag_ninja:
    default: false
    type: boolean
  cmake_version:
    type: string
    
runs:
  using: composite
  steps:
  - name: install ${{inputs.cmake_version}}
    shell: bash
    working-directory: ./action_scripts
    run: |
      bash ./install_dependencies.sh ${{inputs.flag_ninja}} ${{inputs.cmake_version}}


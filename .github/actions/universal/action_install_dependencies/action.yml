inputs:
  flag_ninja:
    default: false
    type: boolean
  cmake_version:
    type: string
    
runs:
  using: composite
  steps:
  - name: install ${{inputs.cmake_version}}
    shell: bash
    run: |
      ls
      echo $PWD
      echo ${{github.workspace}}
      echo ${{github.action_path}}
      bash ${{github.action_path}}/install_dependencies.sh ${{inputs.flag_ninja}} ${{inputs.cmake_version}}

    